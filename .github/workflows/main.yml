name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test  # 这是保命符，测试不过绝不部署
    steps:
      - uses: actions/checkout@v4
      - name: Deploy script
        run: ./deploy.sh
